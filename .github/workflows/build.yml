name: Build and validate

on:
  pull_request:
  push:
    branches: [main, agent/core-ops-phase-2]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opscore
          POSTGRES_USER: opscore
          POSTGRES_PASSWORD: opscore-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opscore -d opscore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Start API and verify latest migration
        env:
          DATABASE_URL: postgres://opscore:opscore-test-password@127.0.0.1:5432/opscore
          JWT_SECRET: ci-only-jwt-secret-not-for-production
          OPSCORE_ADMIN_PASSWORD: ci-only-admin-password
          PORT: 5058
        run: |
          node dist/server-v9.js > /tmp/opscore-api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5058/ready > /tmp/ready.json; then break; fi
            sleep 1
          done
          cat /tmp/ready.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/ready.json'));if(!r.ok||r.latestMigration!=='038-phase12'||!r.latestMigrationApplied)process.exit(1)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check

  dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/api/Dockerfile.v9
          failure-threshold: error
      - run: docker build -f apps/api/Dockerfile.v9 -t opscore-api:pr .
      - run: docker build -f apps/web/Dockerfile.v9 -t opscore-web:pr .
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/web/Dockerfile.v9
          failure-threshold: error
