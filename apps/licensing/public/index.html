<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Core Ops Licensing Portal</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9f2fb;background:#07111f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,rgba(0,207,214,.10),transparent 28%),linear-gradient(135deg,#06101d,#0a1728 55%,#07111f);min-height:100vh}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid rgba(134,173,211,.14);padding:24px 18px;background:rgba(4,14,27,.76);backdrop-filter:blur(12px)}.brand{font-weight:900;font-size:18px;letter-spacing:.02em}.brand span{display:block;font-size:10px;letter-spacing:.22em;color:#31dce2;margin-top:4px}.nav{margin-top:26px;display:grid;gap:7px}.nav button{width:100%;text-align:left;border:0;border-radius:10px;padding:11px 12px;background:transparent;color:#9cb2c8;cursor:pointer}.nav button.active,.nav button:hover{background:#10243a;color:white}.main{padding:28px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;color:#8198af}.token{display:flex;gap:8px}.token input{width:310px}.panel{background:rgba(11,28,48,.86);border:1px solid rgba(126,174,216,.15);border-radius:15px;padding:18px;margin-top:18px;box-shadow:0 16px 44px rgba(0,0,0,.16)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#0c1c30;border:1px solid rgba(126,174,216,.12);border-radius:13px;padding:15px}.stat span{font-size:10px;color:#7590a9;text-transform:uppercase;letter-spacing:.08em}.stat b{display:block;font-size:24px;margin-top:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.toolbar h2{margin:0;font-size:17px}.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#25ddd7,#19bade);color:#031521}.btn.secondary{background:#15283f;color:#dbe8f4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid rgba(126,174,216,.13);background:#091929;border-radius:12px;padding:14px}.card h3{margin:0 0 5px;font-size:14px}.muted{color:#7d96ad;font-size:11px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#10334a;color:#48e0e3;font-size:10px;font-weight:800}.row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(126,174,216,.10);font-size:11px}.row:last-child{border-bottom:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{font-size:10px;color:#9eb1c3;font-weight:700}input,select,textarea{width:100%;margin-top:5px;background:#071726;border:1px solid #203954;border-radius:9px;padding:10px;color:#edf7ff;outline:none}textarea{min-height:72px;resize:vertical}.modalBack{position:fixed;inset:0;background:rgba(1,8,16,.72);display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0a192b;border:1px solid #24425f;border-radius:16px;padding:20px}.modal h2{margin-top:0}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.hidden{display:none!important}.checkrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}.checkrow label{display:flex;gap:6px;align-items:center}.checkrow input{width:auto;margin:0}.error{color:#ff9baa;font-size:11px;margin-top:8px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.stats,.grid,.formgrid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.token{width:100%;flex-direction:column}.token input{width:100%}.top{flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand">CORE OPS<span>LICENSING PORTAL</span></div><div class="nav"><button data-page="dashboard" class="active">Dashboard</button><button data-page="customers">Customers</button><button data-page="licences">Licences</button><button data-page="installations">Installations</button><button data-page="audit">Audit</button></div></aside>
<main class="main">
<div class="top"><div><h1 id="title">Licensing Dashboard</h1><p id="subtitle">Central customer, entitlement and installation control.</p></div><div class="token"><input id="adminToken" type="password" placeholder="Admin API token"><button class="btn secondary" id="saveToken">Use token</button></div></div>
<div id="content"></div>
</main></div>
<div id="modalRoot"></div>
<script>
let page='dashboard',customers=[],licences=[],installations=[],audit=[];
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function token(){return localStorage.getItem('coreops_licensing_admin_token')||''}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token()}`,...(options.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||`HTTP ${r.status}`);return b}
async function load(){try{[customers,licences,installations,audit]=await Promise.all([api('/api/admin/customers'),api('/api/admin/licences'),api('/api/admin/installations'),api('/api/admin/audit')]);render()}catch(e){$('#content').innerHTML=`<section class="panel"><b>Portal not connected</b><p class="muted">${esc(e.message)}. Enter the LICENSING_ADMIN_TOKEN value above.</p></section>`}}
function render(){const c=$('#content');$('#title').textContent=page==='dashboard'?'Licensing Dashboard':page[0].toUpperCase()+page.slice(1);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='dashboard')c.innerHTML=dashboard();if(page==='customers')c.innerHTML=customersView();if(page==='licences')c.innerHTML=licencesView();if(page==='installations')c.innerHTML=installationsView();if(page==='audit')c.innerHTML=auditView();bind()}
function dashboard(){const active=licences.filter(x=>x.status==='Active').length;const trials=licences.filter(x=>x.licence_type==='Trial'&&x.status==='Active').length;return `<section class="stats"><div class="stat"><span>Customers</span><b>${customers.length}</b></div><div class="stat"><span>Active licences</span><b>${active}</b></div><div class="stat"><span>Trials</span><b>${trials}</b></div><div class="stat"><span>Installations</span><b>${installations.length}</b></div></section><section class="panel"><div class="toolbar"><h2>Recent licences</h2><button class="btn" data-newlicence>Create licence</button></div>${licences.slice(0,8).map(l=>licenceRow(l)).join('')||'<p class="muted">No licences yet.</p>'}</section>`}
function customersView(){return `<section class="panel"><div class="toolbar"><h2>Customers</h2><button class="btn" data-newcustomer>Add customer</button></div><div class="grid">${customers.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><div class="mono">${esc(c.customer_code)}</div><p class="muted">${esc(c.contact_email||'No contact email')}</p><span class="pill">${c.licence_count} licences · ${c.installation_count} installs</span></div>`).join('')||'<p class="muted">No customers.</p>'}</div></section>`}
function licenceRow(l){return `<div class="row"><div><b>${esc(l.customer_name)}</b><div class="mono">${esc(l.licence_key)}</div></div><span>${esc(l.licence_type)} · ${esc(l.plan_name)}</span><span>${esc(l.status)}</span><span>${l.installation_count||0} installations</span></div>`}
function licencesView(){return `<section class="panel"><div class="toolbar"><h2>Licences</h2><button class="btn" data-newlicence>Create licence</button></div>${licences.map(licenceRow).join('')||'<p class="muted">No licences.</p>'}</section>`}
function installationsView(){return `<section class="panel"><div class="toolbar"><h2>Installations</h2></div>${installations.map(i=>`<div class="row"><div><b>${esc(i.customer_name)}</b><div class="mono">${esc(i.installation_id)}</div></div><span>${esc(i.hostname||'—')}</span><span>${esc(i.app_version||'—')}</span><span>${new Date(i.last_seen_at).toLocaleString()}</span></div>`).join('')||'<p class="muted">No installations have checked in yet.</p>'}</section>`}
function auditView(){return `<section class="panel"><div class="toolbar"><h2>Audit</h2></div>${audit.map(a=>`<div class="row"><div><b>${esc(a.action)}</b><div class="muted">${esc(a.customer_name||'System')}</div></div><span>${esc(a.detail)}</span><span>${esc(a.actor)}</span><span>${new Date(a.created_at).toLocaleString()}</span></div>`).join('')||'<p class="muted">No audit records.</p>'}</section>`}
function customerModal(){return `<div class="modalBack"><form class="modal" id="customerForm"><h2>Add customer</h2><div class="formgrid"><label>Customer code<input name="customerCode" required placeholder="ACME-001"></label><label>Name<input name="name" required placeholder="Acme Ltd"></label><label>Contact email<input name="contactEmail" type="email"></label><label>Notes<textarea name="notes"></textarea></label></div><div class="error"></div><div class="actions"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn">Create customer</button></div></form></div>`}
function licenceModal(){return `<div class="modalBack"><form class="modal" id="licenceForm"><h2>Create licence</h2><div class="formgrid"><label>Customer<select name="customerId" required><option value="">Select…</option>${customers.map(c=>`<option value="${c.id}">${esc(c.name)} (${esc(c.customer_code)})</option>`).join('')}</select></label><label>Licence type<select name="licenceType"><option>Trial</option><option>Paid</option></select></label><label>Plan name<input name="planName" value="Full Suite Trial"></label><label>Trial days<input name="trialDays" type="number" min="1" value="30"></label><label>Max users<input name="maxUsers" type="number" min="1" value="10"></label><label>Max sites<input name="maxSites" type="number" min="1" value="5"></label><label>Max assets<input name="maxAssets" type="number" min="1" value="1000"></label><label>Paid expiry<input name="expiresAt" type="date"></label></div><div class="checkrow"><label><input type="checkbox" name="OPSCORE" checked> Core Ops Workflow</label><label><input type="checkbox" name="DCAM" checked> DCAM</label><label><input type="checkbox" name="SERVER_MANAGER" checked> Server Manager</label></div><label>Notes<textarea name="notes"></textarea></label><div class="error"></div><div class="actions"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn">Create licence</button></div></form></div>`}
function bind(){document.querySelector('[data-newcustomer]')?.addEventListener('click',()=>{$('#modalRoot').innerHTML=customerModal();bindModal()});document.querySelector('[data-newlicence]')?.addEventListener('click',()=>{$('#modalRoot').innerHTML=licenceModal();bindModal()})}
function bindModal(){$('[data-close]')?.addEventListener('click',()=>$('#modalRoot').innerHTML='');$('#customerForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('/api/admin/customers',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});$('#modalRoot').innerHTML='';await load()}catch(err){e.currentTarget.querySelector('.error').textContent=err.message}});$('#licenceForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const b=Object.fromEntries(f);b.customerId=Number(b.customerId);b.trialDays=Number(b.trialDays);b.maxUsers=Number(b.maxUsers);b.maxSites=Number(b.maxSites);b.maxAssets=Number(b.maxAssets);b.expiresAt=b.expiresAt||null;b.entitlements={OPSCORE:f.has('OPSCORE'),DCAM:f.has('DCAM'),SERVER_MANAGER:f.has('SERVER_MANAGER')};try{await api('/api/admin/licences',{method:'POST',body:JSON.stringify(b)});$('#modalRoot').innerHTML='';await load()}catch(err){e.currentTarget.querySelector('.error').textContent=err.message}})}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));$('#saveToken').onclick=()=>{localStorage.setItem('coreops_licensing_admin_token',$('#adminToken').value);load()};$('#adminToken').value=token();if(token())load();else render();
</script>
</body>
</html>
